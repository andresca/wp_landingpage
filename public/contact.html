  <main>
    <section class="page-head">
      <p class="eyebrow" data-es="Contacto">Contact</p>
      <h1 data-es="Trabajemos juntos">Let's work together</h1>
      <p class="lead" data-es="Cuéntame sobre tu proyecto, o simplemente saluda.">Tell me about your project, or just say hi. I reply soon.</p>
    </section>

    <section class="section first contact-layout">
      <form id="contact-form" class="card contact-form">
        <label><span data-es="Nombre">Name</span><input name="name" required autocomplete="name" /></label>
        <label><span data-es="Correo">Email</span><input name="email" type="email" required autocomplete="email" /></label>
        <label><span data-es="Empresa (opcional)">Company (optional)</span><input name="company" autocomplete="organization" /></label>
        <label><span data-es="Tu proyecto">Your project</span><textarea name="message" rows="6" required></textarea></label>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button class="btn primary" type="submit" data-es="Enviar mensaje">Send message</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>

      <aside class="contact-side">
        <h3 data-es="O escríbeme directamente">Or reach me directly</h3>
        <a class="btn primary" href="mailto:ankbape@gmail.com">ankbape@gmail.com</a>
        <a class="btn ghost" href="https://www.linkedin.com/in/andres-badel-b40333116/" target="_blank" rel="noopener">LinkedIn</a>
      </aside>
    </section>
  </main>
